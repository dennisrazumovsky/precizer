# precizer configuration file
#
# This file saves the settings for a scan so they do not have to be entered
# on the command line each time. Running precizer without arguments uses
# precizer.conf in the folder where the command is started
#
# Another file can be selected with precizer --config=/path/to/task.conf
# All settings for that run belong in the selected file. Adding scan options
# or folder paths to that command causes an error. Commands that supply their
# own settings without --config ignore this file
#
# All settings below are turned off. Removing the # before a setting activates
# it. Fixed defaults are shown where they can be written as values. Settings
# without such a value have a Default description and separate examples
# marked Example; those examples use values chosen for illustration
# Lines beginning with # are comments and have no effect on the scan
#
# Boolean settings accept true or false. The alternatives yes/no, on/off,
# y/n, and 1/0 are also accepted; letter case does not matter

# path: folders to scan
# Values: one folder path per entry. Default: no folders selected
# The scan starts in this folder and includes its subfolders. precizer reads
# the files and calculates their checksums, which allow later comparisons
# to identify files with different contents. At least one folder is required
#
# A full path such as /mnt/storage identifies the folder directly. A relative
# path such as photos starts from the folder where precizer is launched, even
# when this configuration file is stored elsewhere. Paths are written without
# quotation marks, including paths with spaces
# Example: scan /mnt/storage and its subfolders
#path = /mnt/storage

# Example: several folders listed by repeating path, one folder per line
#path = /mnt/storage
#path = /mnt/backup

# Example: the same list continued on the following lines with spaces before
# each additional path. Removing # from both lines activates this example
#path = /mnt/storage
#     /mnt/backup

# database: where to save the scan results
# Values: a database file path. Default: the computer name followed by .db
# The database keeps file paths, checksums, sizes, and timestamps for later
# comparisons. The file contents themselves remain in the scanned folders
#
# Without this setting, the database is named after the computer and saved in
# the folder where precizer is launched: for example, host1.db on host1
# A chosen name helps keep results from different scans in separate databases.
# A filename without a full path is also relative to the launch folder, and
# quotation marks are unnecessary even when the name contains spaces
# Example: save this scan in a database with a chosen path
#database = /mnt/databases/storage.db

# check-level: how thoroughly to check the database before using it
# Values: FULL or QUICK (case-insensitive). Default: FULL
# This checks the database file itself for damage. FULL is the default and
# performs a comprehensive check. QUICK checks its basic structure and can
# reduce the time spent checking a large database
#check-level = FULL

# update: refresh an existing database after files have changed
# Values: true or false. Default: false
# The first scan creates a database with this setting turned off, which is
# the default. Once the database exists, update = true allows its records to
# follow changes in the scanned folders. New files are added, records for
# deleted files are removed, and checksums are recalculated for files whose
# size or last modification time has changed. The scanned files stay untouched
#
# Updating normally requires the same starting folders used to create the database
# and replaces the previous records for changed files. It is appropriate when
# these changes are expected and should become the new saved results.
# An intentional change of starting folders also requires force = true.
# Leaving this setting commented out, or using update = false, protects an
# existing database from accidental updates
#update = false

# force: allow a change of the starting folders saved in an existing database
# Values: true or false. Default: false
# precizer normally stops when the selected folders differ from those saved
# in the database. This protects previous scan results if the wrong folder
# is selected by mistake
#
# With force = true, an update can use the new folders and replace the saved
# starting paths. This is useful after deliberately moving a collection to
# another location, such as a different drive or mount point. The path entries
# must point to that new location, and update = true allows the scan to refresh
# the existing database
#
# Selecting unrelated folders can replace or remove saved file records and
# checksums. The files themselves stay untouched. Force is off by default;
# after the intended change, force = false restores the protection against
# accidentally selecting different folders
#force = false

# progress: show how far the scan has progressed
# Values: true or false. Default: false
# With progress = true, the display shows how many files and how much data
# have been processed. Before checking file contents, precizer first walks
# the selected folders to count files and their total size. This extra pass
# can take a while on large collections
#
# Progress is useful while watching a scan in a terminal. For automatic runs,
# leaving this setting off, or using progress = false, avoids the extra
# counting pass. Progress is off by default
#
# With progress enabled, collected warnings and errors are also shown again
# before the program finishes so they remain visible after the progress display
#progress = false

# maxdepth: how many levels of subfolders to scan
# Values: a whole number from 0 to 32767. Default: no limit (setting omitted)
# The starting folder is level 0. With maxdepth = 0, only files directly in
# that folder are processed. A value of 1 also includes its immediate
# subfolders; larger values include more levels
#
# A depth limit is useful when only files near the top of a folder tree need
# to be recorded. Leaving this setting commented out allows the scan to reach
# every level. The limit can be any whole number from 0 to 32767
# Example: scan down to level 3 instead of using the unlimited default
#maxdepth = 3

# ignore: leave selected files out of the scan
# Values: a PCRE2 regular expression per entry. Default: no ignore rules
# This is useful for caches, temporary files, and other data that does not
# need to be recorded. Rules match paths relative to each starting folder.
# For example, with path = /mnt/storage, ^cache/ selects files inside
# /mnt/storage/cache and its subfolders. The ^ means the path must start
# with cache/, so a folder such as photos/cache is not selected by this rule
#
# Rules use PCRE2 regular expressions, written without quotation marks.
# Example: exclude files whose names end in .log; the backslash
# makes the dot a literal part of the filename, and $ marks its end
#ignore = \.log$

# Example: several rules listed by repeating ignore. A match with any rule
# is enough to exclude a path
#ignore = ^cache/
#ignore = ^tmp/
#ignore = ^something_eles/
#ignore = ^other/
#ignore = ^things/

# Example: an equivalent way to write the same five rules. Each indented line
# adds another rule to the preceding ignore entry. Removing # from every
# example line keeps the indentation that identifies these continuations
#ignore = ^cache/
#    ^tmp/
#    ^something_eles/

#ignore = ^other/
#    ^things/

# Ignoring files does not delete them or remove their existing database
# records. Removing ignored records during an update requires
# db-drop-ignored = true. An include rule can bring excluded paths back.
# In comparison mode, ignore limits the reported differences; a report of
# equal databases then applies only to the paths left in the comparison

# include: keep selected files even when an ignore rule matches
# Values: a PCRE2 regular expression per entry. Default: no include rules
# This provides exceptions to ignore rules. For example, a cache folder may
# contain a keep subfolder whose files should still be recorded.
# Example: exclude the cache contents except for files under cache/keep
#ignore = ^cache/
#include = ^cache/keep/

# Like ignore, include uses PCRE2 regular expressions for paths relative to
# each starting folder, without quotation marks. Several exceptions can be
# listed by repeating include or by adding indented continuation lines
# Example: two exceptions listed in separate entries
#include = ^cache/keep/
#include = ^tmp/keep/

# Example: the same two exceptions written with a continuation line
#include = ^cache/keep/
#    ^tmp/keep/

# Include only brings back paths excluded by ignore. Files that were never
# excluded remain part of the scan, so include alone does not limit a scan
# to matching files. In comparison mode, restored paths also take part in
# the reported differences and the final equality summaries

# watch-timestamps: recheck file contents after changes to file attributes
# Values: true or false. Default: false
# When updating an existing database, a file with a saved checksum is normally
# read again when its size or last content modification time (mtime) changes.
# With watch-timestamps = true, changes to its status change time (ctime) or
# allocated disk space also trigger a new checksum calculation
#
# This is useful when a change to permissions, ownership, or other attributes
# should prompt another check of the file contents, even if its size and mtime
# are unchanged. The last access time is not used for this decision
#
# The setting is off by default. Enabling it can make updates take longer:
# changing permissions alone can cause large files to be read in full again.
# Leaving it commented out, or using watch-timestamps = false, keeps the
# usual size and mtime checks. Updating an existing database requires
# update = true
#watch-timestamps = false

# db-drop-ignored: remove ignored file records from an existing database
# Values: true or false. Default: false
# Adding an ignore rule normally leaves previously saved records in place.
# With update = true and db-drop-ignored = true, records that match the ignore
# rules are removed along with their saved checksums. The files on disk
# remain untouched
#
# This is useful when files recorded by an earlier scan should no longer
# belong to the database, such as temporary files now excluded by an ignore
# rule. The cleanup also covers ignored files that have already disappeared
# from disk
#
# Paths brought back by include follow the normal update rules instead of
# being removed as ignored. Records protected by lock-checksum are preserved.
# This setting is off by default; leaving it commented out, or using
# db-drop-ignored = false, keeps ignored records for later use
#db-drop-ignored = false

# quiet-ignored: hide messages about files excluded by ignore rules
# Values: true or false. Default: false
# Once the ignore and include rules work as intended, messages about every
# skipped file can make the output harder to read. With quiet-ignored = true,
# those messages are hidden while reports about processed files, warnings,
# errors, and the final summary remain visible
#
# This changes only what is displayed. The same files are scanned and the
# same records are saved in the database. It is off by default; leaving it
# commented out, or using quiet-ignored = false, keeps skipped-file messages
#quiet-ignored = false

# db-drop-inaccessible: remove database records for inaccessible files
# Values: true or false. Default: false
# A temporary permissions or filesystem problem can make a file unreadable
# even though it still exists. By default, updates keep its saved record and
# checksum so a temporary loss of access does not erase that information
#
# With update = true and db-drop-inaccessible = true, those records are
# removed from the database. This is useful when inaccessible files should
# no longer be tracked. The files on disk remain untouched
#
# Files excluded by ignore keep their records unless db-drop-ignored is also
# enabled. Records protected by lock-checksum are preserved
#
# This setting is off by default; leaving it commented out, or using
# db-drop-inaccessible = false, keeps records for inaccessible files
#db-drop-inaccessible = false
