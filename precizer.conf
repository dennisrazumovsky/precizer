# precizer configuration
# Without CLI arguments, precizer reads this file from the working directory
# --config=FILE or -g FILE selects a different file. Help, usage, and version
# requests ignore any configuration file. Otherwise, explicit file selection
# cannot be combined with other CLI arguments. Ordinary CLI runs ignore this file
# Uncommented settings use key = value. A # after whitespace starts a comment

# path: filesystem directory to scan
# At least one path is required for scanning. Relative paths are resolved from
# the working directory, even when the configuration file is stored elsewhere
# Values contain the path itself, without shell quotes or variable expansion
# path = /mnt/storage

# Repeated path entries append directories in file order
# path = /mnt/storage
# path = /mnt/backup

# Indented continuation lines also append directories to the preceding key
#path = /mnt/storage
#     /mnt/backup

# database: path to the database file
# If omitted, the filename is the local hostname followed by .db
# Relative paths are resolved from the working directory, not the config directory
# Spaces and UTF-8 characters are used literally, without shell quotes
# If database appears more than once, the last value is used
#database = /mnt/databases/storage.db

# check-level: database integrity verification level
# FULL (default) performs comprehensive verification; QUICK runs a faster check
# Values are case-insensitive. If repeated, the last value is used
# Empty values and values other than FULL or QUICK are rejected
#check-level = FULL
