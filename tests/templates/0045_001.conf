# Repeated keys and indented values retain their original order across sections
ignore = ^cache/
    ^tmp/
    ^something_eles/

[filters]
ignore = ^other/
	^things/
# A comment adds no value
[directories]
path : /data/first
[backup]
path = /data/second#suffix
include = ^one;two=three:four/
	^following/ # comment
db-clean-ignored = true
db-clean-ignored = false
drop-inaccessible = false
start-device-only = 1
start-device-only = 0
check-level = FULL
[]
check-level = QUICK
color = auto
color = never
dry-run = with-checksums
path = root with spaces   # Trailing value whitespace is trimmed
    [literal continuation]
ignore = ^before#after
maxdepth = 1
[directories]
maxdepth = 7
database = /first/old.db
database = /second/final.db
compare-filter = checksum-mismatch
    first-source
silent = true
verbose = true
verbose = false
