path = "/mnt/my files"
path = '  spaced path  '
path = "$HOME/$(literal)"
ignore = "^proc/.*" # Comment after the closing quote
    '^sys/.*'
ignore = "\.log$"
ignore = '^\w+\s+\d+$'
ignore = '"literal quotes"'
ignore = "^before#after"
ignore = ^literal"$
include = "^dir with spaces/"
database = '/tmp/my data.db'
maxdepth = "3"
check-level = 'qUiCk'
update = "yes"
quiet-ignored = 'true'
quiet-ignored = "oFf"
progress = '1'
progress = "0"
dry-run = 'with-checksums'
